[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
dirs = "6.0.0"
pico-args = "0.5.0"
rust-s3 = "0.37.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
snafu = "0.9.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
